plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
}

android {
    namespace 'com.example.database_room'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.database_room"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // ✅ Java 17 (correct)
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // ✅ Kotlin JVM target must match Java
    kotlinOptions {
        jvmTarget = '17'
    }

    // ✅ (Recommended) Enable ViewBinding (optional but useful)
    buildFeatures {
        viewBinding true
    }
}

dependencies {

    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // ✅ Room Database
    def room_version = "2.6.1"

    implementation "androidx.room:room-runtime:$room_version"
    kapt "androidx.room:room-compiler:$room_version"

    implementation "androidx.room:room-ktx:$room_version"

    // ✅ (IMPORTANT) Lifecycle + Coroutines (you are using lifecycleScope)
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.7.0"

    // ✅ (Optional but good practice)
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"
}